[project]
name = "jobify"
version = "0.1.0"
description = "Automated job search: scrape career portals, match with your profile using a local LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
jobify = "jobify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
